
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraNet — Search Books</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="logo"><strong>Libra</strong>Net</div>
  <ul class="nav-links">
    <li><a href="index.html">🏠 Home</a></li>
    <li><a href="register.html">👤 Register</a></li>
    <li><a href="search.html" class="active">🔍 Search</a></li>
    <li><a href="issue.html">📖 Issue / Return</a></li>
    <li><a href="reports.html">📊 Reports</a></li>
  </ul>
</nav>

<div class="page">
  <div class="card">
    <div class="card-title">🔍 Search Books</div>
    <div class="filter-tabs">
      <button class="ftab active" onclick="setTab(this,'title')">By Title</button>
      <button class="ftab" onclick="setTab(this,'author')">By Author</button>
      <button class="ftab" onclick="setTab(this,'id')">By Book ID</button>
    </div>
    <div class="search-row">
      <input class="s-input" id="searchInput" placeholder="e.g. Harry Potter...">
      <button class="s-btn" onclick="doSearch()">Search</button>
    </div>
    <div id="searchResults"></div>
  </div>
  <div class="footer">LibraNet &middot; VCE &middot; Library Management System</div>
</div>

<script src="api.js"></script>
<script src="main.js"></script>
</body>
